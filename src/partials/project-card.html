<a
	href="@@url"
	target="_blank"
	rel="noopener"
	data-cat="@@cat"
	aria-label="@@title — open live site in new tab"
	class="project-item reveal group block cursor-pointer rounded-3xl border border-black/[0.06] bg-light/60 p-3 transition duration-300 hover:-translate-y-1 hover:border-primary/30 hover:shadow-[0_20px_40px_-20px_rgba(124,58,237,0.35)] focus:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:border-white/[0.06] dark:bg-white/[0.02]">
	<div class="project-shot bg-gradient-to-br @@grad">
		<!-- Fallback cover (shows if screenshot fails) -->
		<div class="absolute inset-0 grid place-content-center p-6 text-center" aria-hidden="true">
			<span class="font-mono text-[11px] uppercase tracking-[0.2em] text-white/70">@@domain</span>
			<span class="mt-2 text-3xl font-bold leading-tight text-white">@@title</span>
		</div>
		<img
			src="@@img"
			alt="Screenshot of @@title"
			width="1200"
			height="750"
			loading="lazy"
			decoding="async"
			onerror="this.remove()" />
		<!-- Browser chrome -->
		<div
			class="absolute inset-x-0 top-0 flex items-center gap-1.5 bg-gradient-to-b from-black/50 to-transparent px-3 py-2.5"
			aria-hidden="true">
			<span class="h-2 w-2 rounded-full bg-white/60"></span>
			<span class="h-2 w-2 rounded-full bg-white/40"></span>
			<span class="h-2 w-2 rounded-full bg-white/25"></span>
			<span class="ml-2 truncate font-mono text-[10px] text-white/80">@@domain</span>
		</div>
		<span
			class="absolute bottom-3 right-3 inline-flex items-center gap-1 rounded-full bg-white px-3 py-1.5 text-xs font-semibold text-dark shadow-lg transition duration-300 lg:translate-y-2 lg:opacity-0 lg:group-hover:translate-y-0 lg:group-hover:opacity-100"
			aria-hidden="true">
			Visit live
			<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5"><path d="M6 14 14 6M7 6h7v7" /></svg>
		</span>
	</div>
	<div class="px-2 pb-2 pt-4">
		<p class="eyebrow">@@label</p>
		<h3 class="mt-1.5 text-xl font-semibold tracking-tight text-dark transition group-hover:text-primary dark:text-white dark:group-hover:text-primary-light">
			@@title
		</h3>
		<p class="mt-1.5 text-sm leading-relaxed text-muted dark:text-light/60">@@desc</p>
		<p class="mt-3 font-mono text-[11px] text-dark/50 dark:text-light/40">@@stack</p>
	</div>
</a>
